<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Poly-Bubble 3D AI Generator</title>
  <style>
    :root {
      --bg-color: #121212;
      --card-bg: #1e1e1e;
      --accent-color: #00b4d8;
      --accent-hover: #90e0ef;
      --text-color: #ffffff;
      --text-dim: #a0a0a0;
      --border-color: #333333;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* Header */
    header {
      padding: 1rem 1.5rem;
      background-color: var(--card-bg);
      border-bottom: 1px solid var(--border-color);
      text-align: center;
    }

    header h1 {
      font-size: 1.4rem;
      letter-spacing: 1px;
      color: var(--accent-color);
    }

    /* Main Container Layout */
    .container {
      display: flex;
      flex: 1;
      height: calc(100vh - 60px);
    }

    /* Sidebar Controls */
    .sidebar {
      width: 320px;
      background-color: var(--card-bg);
      border-right: 1px solid var(--border-color);
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
      overflow-y: auto;
    }

    .step-card {
      background-color: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 1rem;
    }

    .step-card h2 {
      font-size: 0.95rem;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--accent-color);
      margin-bottom: 0.75rem;
    }

    /* Form Controls */
    .input-group {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    label {
      font-size: 0.85rem;
      color: var(--text-dim);
    }

    input[type="file"] {
      display: none;
    }

    .file-upload-btn {
      display: block;
      padding: 0.75rem;
      background-color: #2a2a2a;
      border: 1px dashed var(--accent-color);
      border-radius: 6px;
      text-align: center;
      cursor: pointer;
      font-size: 0.85rem;
      transition: background-color 0.2s;
    }

    .file-upload-btn:hover {
      background-color: #333333;
    }

    .image-preview {
      margin-top: 0.5rem;
      width: 100%;
      max-height: 120px;
      object-fit: contain;
      border-radius: 4px;
      display: none;
    }

    input[type="number"], select {
      width: 100%;
      padding: 0.6rem;
      background-color: #2a2a2a;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      color: var(--text-color);
      font-size: 0.9rem;
    }

    input[type="number"]:focus, select:focus {
      outline: none;
      border-color: var(--accent-color);
    }

    /* Action Buttons */
    .btn-primary {
      padding: 0.85rem;
      background-color: var(--accent-color);
      color: #000000;
      font-weight: bold;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.95rem;
      transition: background-color 0.2s;
    }

    .btn-primary:hover {
      background-color: var(--accent-hover);
    }

    .btn-secondary {
      padding: 0.75rem;
      background-color: transparent;
      color: var(--text-color);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
      transition: border-color 0.2s;
    }

    .btn-secondary:hover {
      border-color: var(--accent-color);
    }

    /* 3D Viewer Canvas Area */
    .viewport {
      flex: 1;
      position: relative;
      background-color: #0a0a0a;
    }

    #webgl-canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Status Overlay */
    .overlay-info {
      position: absolute;
      top: 1rem;
      left: 1rem;
      background: rgba(0, 0, 0, 0.6);
      padding: 0.5rem 0.75rem;
      border-radius: 4px;
      font-size: 0.8rem;
      font-family: monospace;
      color: var(--accent-color);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
  </style>

  <!-- Three.js Library Loaders -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <!-- Step 4 Exporters: OBJ & GLTF/GLB -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/exporters/OBJExporter.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/exporters/GLTFExporter.js"></script>
  
</head>
<body>

  <header>
    <h1>POLY-BUBBLE 3D AI GENERATOR</h1>
  </header>

  <div class="container">
    <!-- Sidebar Controls -->
    <aside class="sidebar">
      
      <!-- Step 1: Upload Source Image -->
      <div class="step-card">
        <h2>Step 1: Upload Image</h2>
        <div class="input-group">
          <label for="image-upload" class="file-upload-btn" id="upload-label">
            Choose 2D Source Image
          </label>
          <input type="file" id="image-upload" accept="image/*">
          <img id="image-preview" class="image-preview" alt="Upload Preview">
        </div>
      </div>

      <!-- Step 2: Set Polygon Budget -->
      <div class="step-card">
        <h2>Step 2: Polygon Budget</h2>
        <div class="input-group">
          <label for="poly-budget">Target Polygon Count (Max):</label>
          <input type="number" id="poly-budget" value="5000" min="500" max="50000" step="500">
        </div>
      </div>

      <!-- Step 3: AI Poly-Bubble Trigger -->
      <div class="step-card">
        <h2>Step 3: Generate</h2>
        <button id="generate-btn" class="btn-primary" style="width: 100%;">
          Generate In-Bubble Model
        </button>
      </div>

      <!-- Step 4: Export Model -->
      <div class="step-card">
        <h2>Step 4: Export</h2>
        <div class="input-group">
          <label for="export-format">Format:</label>
          <select id="export-format">
            <option value="obj">OBJ + MTL Bundle</option>
            <option value="glb">GLTF / GLB</option>
          </select>
          <button id="export-btn" class="btn-secondary" style="margin-top: 0.5rem;">
            Export Zero-Loss File
          </button>
        </div>
      </div>

    </aside>

    <!-- 3D Display Viewport -->
    <main class="viewport">
      <div class="overlay-info" id="stats-overlay">
        Poly Count: Locked (0) | Status: Awaiting Image
      </div>
      <canvas id="webgl-canvas"></canvas>
    </main>
  </div>

  <script>
    // Preview Image Loader Script
    const imageInput = document.getElementById('image-upload');
    const imagePreview = document.getElementById('image-preview');
    const uploadLabel = document.getElementById('upload-label');

    imageInput.addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(event) {
          imagePreview.src = event.target.result;
          imagePreview.style.display = 'block';
          uploadLabel.textContent = "Change Image (" + file.name + ")";
        };
        reader.readAsDataURL(file);
      }
    });
  </script>
<script src="app.js"></script>
  
</body>
</html>
